орм витамина С (аскорбилпальмитат, магния аскорбилфосфат, аскорбилфосфат натрия), витамин А (ретинилпальмитат), гиалуроновая кислота, экстракт семян винограда, супероксиддисмутаза.",usage:"Вечером нанесите небольшое количество крема на очищенную кожу лица и шеи. Равномерно распределите. Для максимального эффекта против сухости наносите после увлажняющей сыворотки Vital C Hydrating Anti-Aging Serum."},{id:4,name:"Ночной крем с ретинолом 0.3%",brand:"Image Skincare",price:8e3,category:"face",description:"Ageless Total Retinol-A Crème. Мощное обновление клеток, борьба с акне и морщинами.",gradient:"from-[#E8D5CE] via-[#EDE6DB] to-[#FDFBF7]",emoji:"🌙",concern:"Возрастные морщины, гиперпигментация, постакне, неровный рельеф",isAvailable:!0,details:"Высокоэффективный ночной крем с инкапсулированным ретинолом 0.3%. Уникальная система доставки позволяет ретинолу проникать глубоко в дерму, запуская ускоренное обновление клеток без раздражения эпидермиса. Разглаживает заломы, осветляет пигментные пятна и следы постакне, сужает поры.",ingredients:"Инкапсулированный ретинол 0.3%, гликолевая кислота, молочная кислота, пептидный комплекс (пальмитоил олигопептид), гиалуроновая кислота, экстракт огурца, масло ши.",usage:"Применяйте строго вечером. Очистите лицо, просушите и нанесите небольшую горошину крема, избегая области вокруг глаз. Вводите в уход постепенно: 1-2 раза в неделю в первые две недели, затем увеличивайте частоту. Утром обязательно наносите солнцезащитный крем SPF 30 или SPF 75."},{id:5,name:"Увлажняющий дневной крем SPF 30 Daily Prevention",brand:"Image Skincare",price:5200,category:"spf",description:"Новая премиальная линейка. 100% минеральные фильтры, идеальная база под макияж.",gradient:"from-[#DCC8A3] via-[#EDE6DB] to-[#F7F4EF]",emoji:"☀️",concern:"УФ-излучение, фотостарение, сухость кожи, пигментация",isAvailable:!0,details:"Премиальный солнцезащитный увлажняющий крем нового поколения из линии Daily Prevention. Содержит только безопасные физические минеральные  сатинового шампанского до матового розово-коричневого и сверкающего розового золота. Мягко тушуются и держатся весь день.",ingredients:"Микронизированная слюда, премиальные перламутровые пигменты, растительные масла для мягкого скольжения.",usage:"Используйте кисть или аппликатор. Шаг 1: Нанесите оттенок Prime на все веко. Шаг 2: Выделите складку оттенком Enhance. Шаг 3: Добавьте глубины во внешний уголок с помощью Smoke. Шаг 4: Нанесите пальцем мерцающий Pop в центр века для вечернего сияния."},{id:8,name:"Тени",brand:"Hourglass",price:6500,category:"makeup",description:"Curator Single Eyeshadow. Сверхмелкий помол и шелковистая текстура.",gradient:"from-[#EDE6DB] via-[#F7E7CE] to-[#FFF8F0]",emoji:"👁️",concern:"Стойкий люксовый макияж, идеальное распределение",isAvailable:!0,details:"Профессиональные моно-тени Curator от Hourglass. Известны своим невероятно мелким, невесомым помолом и пигментированностью. Легко наносятся, не скатываются в складку века и создают эффект дорогого бархатного или влажного металлического финиша.",ingredients:"Слюда высокой степени очистки, органические тальки без асбеста, минеральные пигменты.",usage:"Наносите сухой кистью для мягкой дневной тушевки или влажной кистью для создания глубокого, зеркального металлического финиша."},{id:9,name:"Палетка",brand:"Hourglass",price:7500,category:"makeup",description:"Ambient Lighting Palette. Культовое финишное сияние и разглаживание кожи.",gradient:"from-[#F7F4EF] via-[#E8C9A8] to-[#EDE6DB]",emoji:"🌟",concern:'Тусклый цвет лица, видимые поры, неровный тон, отсутствие "Glow"',isAvailable:!0,details:'Культовое трио финишных пудр Ambient Lighting от Hourglass. Созданы по запатентованной фотолюминесцентной технологии. Мельчайшие пудры преломляют и рассеивают свет на лице, создавая эффект "мягкого фокуса", скрывают морщинки, поры и дарят коже роскошное холеное сияние дорогого спа-ухода.',ingredients:"Высокотехнологичный фотолюминесцентный порошок, масло арганы, оксиды железа.",usage:"Наносите большой ческие против химических фильтров: развенчиваем мифы и выбираем безопасный SPF",category:"Защита",excerpt:"Разбираемся в механизме действия минеральной и химической защиты от ультрафиолета.",emoji:"☀️",gradient:"from-[#FDFBF7] via-[#FFF8F0] to-[#E8C9A8]",readTime:"5 мин",content:`Солнцезащитные кремы стали обязательным элементом ухода за кожей. Но как выбрать идеальный фильтр? Физические (минеральные) фильтры, такие как оксид цинка и диоксид титана, работают на поверхности кожи как микро-зеркала, отражая и рассеивая UVA и UVB лучи. Они гипоаллергенны и идеальны для чувствительной кожи, а также после косметологических пилингов. Химические фильтры нового поколения поглощают УФ-лучи и превращают их в тепловую энергию.
