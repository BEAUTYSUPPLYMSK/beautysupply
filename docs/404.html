мплекс пептидов, органическое масло ши, масло сладкого миндаля, экстракт центеллы азиатской, витамин E, гиалуроновая кислота.",usage:"Наносите обильное количество крема на чистую сухую кожу тела дважды в день (утром и вечером). Особое внимание уделяйте проблемным зонам с пониженным тонусом. Массируйте круговыми движениями снизу вверх до полного впитывания."},{id:2,name:"VOL.U.lift (лицо)",brand:"Image Skincare",price:11599,category:"face",description:"Премиальный волюмайзер для лица. Восстанавливает объем и четкость контуров.",gradient:"from-[#E8C9A8] via-[#F7E7CE] to-[#FFF8F0]",emoji:"✨",image:"/products/volu-face.png",concern:"Глубокие морщины, потеря объема лица, птоз, дегидратация",isAvailable:!0,details:"Инновационный ремоделирующий крем-волюмайзер для лица. Работает как безоперационный липофилинг: заполняет морщины изнутри, восстанавливает утраченные объемы скул и щек, подтягивает овал лица. Обеспечивает мощный anti-age эффект и глубокое клеточное питание.",ingredients:"Эксклюзивный комплекс пептидов-волюмайзеров, растительные стволовые клетки яблока, экстракт комбучи, стабильный витамин C, экстракт морских водорослей.",usage:"Наносите тонким слоем на предварительно очищенную кожу лица, шеи и декольте легкими похлопывающими движениями по массажным линиям. Рекомендуется использовать ежедневно утром и вечером в сочетании с омолаживающей сывороткой."},{id:3,name:"Восстанавливающий ночной крем с витамином C",brand:"Image Skincare",price:7799,category:"face",description:"Культовый крем Vital C. Глубокое увлажнение, борьба с тусклостью и куперозом.",gradient:"from-[#FDFBF7] via-[#FFF8F0] to-[#E8C9A8]",emoji:"🍊",image:"/products/vital-c.png",concern:"Сухость, тусклый цвет лица, купероз, розацеа, фотостарение",isAvailable:!0,details:"Бестселлер бренда Image Skincare из серии Vital C. Ночной крем с высокой концентрацией стабильных форм витамина C и антиоксидантов. За ночь полностью реанимирует уставшую, обезвоженную кожу, гасит воспаления, укрепляет стенки капилляров при куперозе и дарит лицу невероятное утреннее сияние.",ingredients:"20% смесь трех стабильных форм витамина С (аскорбилпальмитат, магния аскорбилфосфат, аскорбилфосфат натрия), витамин А (ретинилпальмитат), гиалуроновая кислота, экстракт семян винограда, супероксиддисмутаза.",usage:"Вечером нанесите небольшое количество крема на очищенную кожу лица и шеи. Равномерно распределите. Для максимального эффекта против сухости наносите после увлажняющей сыворотки Vital C Hydrating Anti-Aging Serum."},{id:4,name:"Ночной крем с ретинолом 0.3%",brand:"Image Skincare",price:8e3,category:"face",description:"Ageless Total Retinol-A Crème. Мощное обновление клеток, борьба с акне и морщинами.",gradient:"from-[#E8D5CE] via-[#EDE6DB] to-[#FDFBF7]",emoji:"🌙",image:"/products/retinol.png",concern:"Возрастные морщины, гиперпигментация, постакне, неровный рельеф",isAvailable:!0,details:"Высокоэффективный ночной крем с инкапсулированным ретинолом 0.3%. Уникальная система доставки позволяет ретинолу проникать глубоко в дерму, запуская ускоренное обновление клеток без раздражения эпидермиса. Разглаживает заломы, осветляет пигментные пятна и следы постакне, сужает поры.",ingredients:"Инкапсулированный ретинол 0.3%, гликолевая кислота, молочная кислота, пептидный комплекс (пальмитоил олигопептид), гиалуроновая кислота, экстракт огурца, масло ши.",usage:"Применяйте строго вечером. Очистите лицо, просушите и нанесите небольшую горошину крема, избегая области вокруг глаз. Вводите в уход постепенно: 1-2 раза в неделю в первые две недели, затем увеличивайте частоту. Утром обязательно наносите солнцезащитный крем SPF 30 или SPF 75."},{id:5,name:"Увлажняющий дневной крем SPF 30 Daily Prevention",brand:"Image Skincare",price:5200,category:"spf",description:"Новая премиальная линейка. 100% минеральные фильтры, идеальная база под макияж.",gradient:"from-[#DCC8A3] via-[#EDE6DB] to-[#F7F4EF]",emoji:"☀️",image:"/products/spf30.png",concern:"УФ-излучение, фотостарение, сухость кожи, пигментация",isAvailable:!0,details:"Премиальный солнцезащитный увлажняющий крем нового поколения из линии Daily Prevention. Содержит только безопасные физические минеральные фильтры (оксид цинка), которые отражают весь спектр UVA/UVB лучей. Не оставляет белого налета, интенсивно увлажняет кожу и служит безупречной базой под люксовые пудры и тона.",ingredients:"Оксид цинка (физический фильтр), запатентованный комплекс антиоксидантов, экстракт зеленого чая, сок алоэ вера, гиалуроновая кислота, масло арганы.",usage:"Наносите обильное количество крема на лицо и открытые участки кожи за 15 минут до выхода на улицу. Распределите мягкими движениями. При необходимости обновляйте каждые 2 часа при нахождении на активном солнце."},{id:6,name:"Усиленный смарт-крем SPF 75",brand:"Image Skincare",price:6e3,category:"spf",description:"Максимальная защита кожи после пилингов, лазера и в горах.",gradient:"from-[#EDE6DB] via-[#F7F4EF] to-[#E8C9A8]",emoji:"🛡️",image:"/products/spf75.png",concern:"Экстремальное солнце, гиперчувствительность после процедур, пигментные пятна",isAvailable:!0,details:"Ультра-защитный дневной смарт-крем с фактором SPF 75. Разработан для максимальной защиты поврежденной, чувствительной и подвергшейся агрессивным косметическим процедурам (пилинги, лазерная шлифовка) кожи. Блокирует 99% излучения, предотвращает появление гиперпигментации и рубцов.",ingredients:"Оксид цинка, титановые микросферы, комплекс фотосом и роксисом (восстановление ДНК клеток под действием света), витамин C, пантенол, аллантоин.",usage:"Равномерно нанесите на лицо и шею после очищения и сыворотки утром. Применяйте каждый раз после агрессивных салонных процедур перед выходом на улицу, даже в пасмурную погоду."},{id:7,name:"Pillow Talk тени",brand:"Charlotte Tilbury",price:7500,category:"makeup",description:"Культовая люксовая палетка из 4 оттенков. Легендарный нежный нюд.",gradient:"from-[#E8D5CE] via-[#FFF8F0] to-[#E8C9A8]",emoji:"🎨",image:"/products/pillow-talk.png",concern:"Нюдовый макияж, праздничный образ, роскошный финиш",isAvailable:!0,details:"Знаменитая четырехцветная палетка теней Luxury Palette в оттенке Pillow Talk от звездного визажиста Шарлотты Тилбери. Содержит идеально подобранные пудровые текстуры: от сатинового шампанского до матового розово-коричневого и сверкающего розового золота. Мягко тушуются и держатся весь день.",ingredients:"Микронизированная слюда, премиальные перламутровые пигменты, растительные масла для мягкого скольжения.",usage:"Используйте кисть или аппликатор. Шаг 1: Нанесите оттенок Prime на все веко. Шаг 2: Выделите складку оттенком Enhance. Шаг 3: Добавьте глубины во внешний уголок с помощью Smoke. Шаг 4: Нанесите пальцем мерцающий Pop в центр века для вечернего сияния."},{id:8,name:"Тени",brand:"Hourglass",price:6500,category:"makeup",description:"Curator Single Eyeshadow. Сверхмелкий помол и шелковистая текстура.",gradient:"from-[#EDE6DB] via-[#F7E7CE] to-[#FFF8F0]",emoji:"👁️",image:"/products/curator.png",concern:"Стойкий люксовый макияж, идеальное распределение",isAvailable:!0,details:"Профессиональные моно-тени Curator от Hourglass. Известны своим невероятно мелким, невесомым помолом и пигментированностью. Легко наносятся, не скатываются в складку века и создают эффект дорогого бархатного или влажного металлического финиша.",ingredients:"Слюда высокой степени очистки, органические тальки без асбеста, минеральные пигменты.",usage:"Наносите сухой кистью для мягкой дневной тушевки или влажной кистью для создания глубокого, зеркального металлического финиша."},{id:9,name:"Палетка",brand:"Hourglass",price:7500,category:"makeup",description:"Ambient Lighting Palette. Культовое финишное сияние и разглаживание кожи.",gradient:"from-[#F7F4EF] via-[#E8C9A8] to-[#EDE6DB]",emoji:"🌟",image:"/products/ambient-palette.png",concern:'Тусклый цвет лица, видимые поры, неровный тон, отсутствие "Glow"',isAvailable:!0,details:'Культовое трио финишных пудр Ambient Lighting от Hourglass. Созданы по запатентованной фотолюминесцентной технологии. Мельчайшие пудры преломляют и рассеивают свет на лице, создавая эффект "мягкого фокуса", скрывают морщинки, поры и дарят коже роскошное холеное сияние дорогого спа-ухода.',ingredients:"Высокотехнологичный фотолюминесцентный порошок, масло арганы, оксиды железа.",usage:"Наносите большой пушистой кистью на все лицо в качестве финального шага макияжа после тонального крема и консилера. Смешивайте оттенки или используйте по отдельности как пудру, хайлайтер и деликатный бронзер."},{id:10,name:"Румяна",brand:"Hourglass",price:3700,category:"makeup",description:"Ambient Lighting Blush. Мягкий румянец со светоотражающими пигментами.",gradient:"from-[#E8D5CE] via-[#EDE6DB] to-[#FFF8F0]",emoji:"🌸",image:"/products/ambient-blush.png",concern:"Бледность лица, плоский рельеф, уставший вид",isAvailable:!0,details:"Эксклюзивные румяна, сочетающие в себе пигмент румян и знаменитую светоотражающую пудру Ambient. Создают деликатный, многомерный румянец, который сливается с кожей, не подчеркивая шелушения и поры. Идеально подсвечивают щеки.",ingredients:"Органические пигменты, фотолюминофор, масло ши.",usage:"Улыбнитесь и нанесите румяна пушистой скошенной кистью на «яблочки» щек, растушевывая по направлению к вискам."},{id:11,name:"Контуринг",brand:"Charlotte Tilbury",price:3500,category:"makeup",description:"Hollywood Contour Wand. Знаменитый жидкий скульптор для идеальных скул.",gradient:"from-[#EDE6DB] via-[#E8C9A8] to-[#F7F4EF]",emoji:"🖌️",concern:"Круглое лицо, отсутствие скульптурности, тусклый плоский макияж",isAvailable:!0,details:"Легендарный жидкий скульптор с мягким поролоновым аппликатором-подушечкой. Обладает идеальным холодным серо-коричневым оттенком без рыжины, имитирующим естественную тень на лице. Тает на коже, легко тушуется даже пальцем и создает точеные голливудские скулы.",ingredients:"Жидкие силиконы нового поколения, пигменты холодного спектра, микроскопические светофильтры.",usage:"Поверните дозатор в положение ON, мягко сожмите тюбик и нанесите точечно 2-3 капли В нашей новой линейке Image Skincare Daily Prevention SPF 30 мы используем усовершенствованную физическую минеральную защиту, которая ложится тончайшим шелковым слоем без белого налета и липкости, обеспечивая мощную профилактику фотостарения и служа идеальной базой под ваш макияж.`},{id:2,title:"Ретинол 0.3%: как начать использовать и не сжечь кожу",category:"Anti-age",excerpt:"Полное руководство по безопасному введению ретиноидов в ночную программу ухода за зрелой кожей.",emoji:"🌙",gradient:"from-[#E8D5CE] via-[#EDE6DB] to-[#FDFBF7]",readTime:"7 мин",content:`Ретинол (витамин А) признан дерматологами «золотым стандартом» омоложения. Он стимулирует выработку коллагена, ускоряет деление клеток, борется с пигментацией и выравнивает рельеф лица. Однако неправильный старт может привести к покраснениям и шелушениям (ретиноидному дерматиту).

Чтобы избежать побочных эффектов, используйте инкапсулированный ретинол 0.3% от Image Skincare Ageless. Инкапсуляция позволяет активному компоненту высвобождаться постепенно в течение ночи. Наносите крем на абсолютно сухую кожу строго вечером, начиная с 2 раз в неделю. И не забывайте про SPF-защиту каждое утро!`},{id:3,title:'Эффект "дорогой" сияющей кожи: пошаговый туториал премиального макияжа',category:"Макияж",excerpt:"Как создать безупречный влажный финиш на лице с помощью Hourglass и Charlotte Tilbury.",emoji:"✨",gradient:"from-[#EDE6DB] via-[#F7E7CE] to-[#FFF8F0]",readTime:"4 мин",content:`Эффект "дорогой холеной кожи" (Glow Skin) — главный тренд голливудских красных дорожек. Он строится на идеальной подготовке кожи и рассеивании света. Сначала нанесите увлажняющую базу или крем Image Skincare SPF 30. Затем выполните легкое контурирование с помощью жидкого скульптора Charlotte Tilbury Hollywood Contour Wand, чтобы прорисовать естественные тени.
